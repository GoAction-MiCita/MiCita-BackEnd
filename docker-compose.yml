# Local stack: PostgreSQL + the API.
# Usage: copy .env.example to .env and fill in the secrets, then:
#   docker compose up           # uses the published image (pulled if it isn't local)
#   docker compose pull --policy always   # fetches the latest push of that tag
#   docker compose up --build   # builds the image from the Dockerfile instead
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-micita}
      POSTGRES_USER: ${DB_USERNAME:-micita}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Published image on Docker Hub. Set API_IMAGE in .env to run another tag.
    image: ${API_IMAGE:-goactionhub/mi-cita-backend:v1.0-test}
    pull_policy: missing
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-micita}
      DB_USERNAME: ${DB_USERNAME:-micita}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 bytes)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:?BOOTSTRAP_USERNAME is required}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?BOOTSTRAP_PASSWORD is required}
      # There are no schema migrations yet and prod only validates the schema,
      # so the local stack lets Hibernate create the tables.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      # prod disables Swagger; SWAGGER_ENABLED turns it back on for the local stack.
      SPRINGDOC_API_DOCS_ENABLED: ${SWAGGER_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  db-data:
