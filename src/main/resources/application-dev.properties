spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/micita}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local-only defaults. Never reuse these outside dev.
micita.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
micita.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:7d}
micita.security.bootstrap-user.username=${BOOTSTRAP_USERNAME:admin}
micita.security.bootstrap-user.password=${BOOTSTRAP_PASSWORD:admin}
