spring.application.name=micita-project
spring.profiles.default=dev

spring.jpa.open-in-view=false

# JWT signing (HS256). The secret must be at least 32 bytes.
micita.security.jwt.secret=${JWT_SECRET}
micita.security.jwt.issuer=micita
# Access token (JWT) lifetime.
micita.security.jwt.expiration=${JWT_EXPIRATION:15m}
# Refresh token lifetime. No default here: each profile sets it.
micita.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ADMIN account seeded into the users table at startup if its username is not taken.
micita.security.bootstrap-user.username=${BOOTSTRAP_USERNAME}
micita.security.bootstrap-user.password=${BOOTSTRAP_PASSWORD}
